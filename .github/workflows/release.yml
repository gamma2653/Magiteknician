name: Release

# Every push to main ends one of three ways.
#
#   Changesets are waiting   -> the release pull request is opened, or
#                               brought up to date. It raises the version
#                               and writes the changelog.
#   None are waiting, and
#   the version has no tag   -> the release pull request has just been
#                               merged. The version is tagged and a GitHub
#                               release is written from the changelog.
#   None are waiting, and
#   the version has its tag  -> nothing to do.

on:
  push:
    branches: [main]

permissions: {}

# One at a time, and never cut short: a release half made is worse than
# one made late.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Open the release pull request, or publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to commit the new version, push its tag and write the release
      pull-requests: write # to open the release pull request
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Every tag, so that a version already released is known to be.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the release tooling
        run: npm ci

      - name: Open the release pull request, or publish the release
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run release:version
          publish-script: npm run release:publish
          pr-title: "Release: promote the changes that are waiting"
          commit-message: "Release: promote the changes that are waiting"
