name: Changesets

# On every pull request: test the release tooling, and leave a comment
# saying whether the pull request has a changeset and what it would
# release. The comment is a reminder and nothing more. A pull request
# without a changeset can be merged; it just won't be in the changelog.

on:
  # No branch filter: stacked pull requests target each other, not main.
  pull_request:

permissions: {}

concurrency:
  group: changesets-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the release tooling
        run: npm ci

      - name: Test it
        run: npm test

      - name: Check that package.json and project.godot agree on the version
        run: node scripts/release/sync_version.mjs --check

  status:
    name: Look for a changeset
    # The release pull request never has changesets: removing them is its
    # job. Pull requests from forks are given no permission to comment.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      comment-body: ${{ steps.status.outputs.comment-body }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: See what the pull request would release
        id: status
        uses: changesets/action/pr-status@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  comment:
    name: Say so on the pull request
    needs: status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # to leave the comment
    steps:
      - name: Comment
        uses: changesets/action/pr-comment@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          body: ${{ needs.status.outputs.comment-body }}
